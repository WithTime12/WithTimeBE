spring:
  config:
    activate:
      on-profile: develop
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
    mongodb:
      uri: ${MONGO_URI}
  mail:
    host: ${MAIL_SENDER_HOST}
    port: 587
    username: ${MAIL_SENDER_USERNAME}
    password: ${MAIL_SENDER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            authorization-grant-type: authorization_code
            client-id: ${KAKAO_CLIENT_ID}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-authentication-method: client_secret_post
            scope:
              - account_email
          naver:
            authorization-grant-type: authorization_code
            redirect-uri: ${NAVER_REDIRECT_URI}
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope:
              - email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization_uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/userinfo/v2/me

jwt:
  secret: ${JWT_SECRET}
  time:
    access-token: 3600000
    refresh-token: 10000000

beginner:
  api:
    payload:
      discord:
        scope:
          - Exception
        web-hook-url: ${DISCORD_WEBHOOK_URL}
        enable: true

weather:
  api:
    key: ${KMA_API_KEY}
    base-url: https://apihub.kma.go.kr

    # API 엔드포인트
    grid-conversion-url: /api/typ01/cgi-bin/url/nph-dfs_xy_lonlat
    short-term-forecast-url: /api/typ02/openApi/VilageFcstInfoService_2.0/getVilageFcst
    medium-term-land-url: /api/typ01/url/fct_afs_wl.php
    medium-term-temp-url: /api/typ01/url/fct_afs_wc.php

    # API 타임아웃 설정
    timeout:
      connect: 5000
      read: 15000

    # 재시도 설정
    retry:
      max-attempts: 3
      backoff-delay: 2000

# 스케줄러 설정
scheduler:
  weather:
    enabled: true  # 스케줄러 활성화 여부

    # 데이터 수집 스케줄
    short-term-cron: "10 2,5,8,11,14,17,20,23 * * * *"  # 단기예보 수집 (매 3시간 10분)
    medium-term-cron: "30 6,18 * * * *"                # 중기예보 수집 (매 12시간 30분)
    cleanup-cron: "0 0 3 * * *"                        # 데이터 정리 (매일 새벽 3시)

    # 추천 정보 생성 스케줄
    recommendation:
      short-term-cron: "0 5 * * * *"        # 단기예보 추천 (매 시간 5분) - 0-2일
      medium-term-cron: "0 30 */6 * * *"    # 중기예보 추천 (6시간마다 30분) - 3-6일

    # 데이터 보관 기간 설정
    retention:
      short-term-days: 7   # 단기 예보 보관 기간
      medium-term-days: 7  # 중기 예보 보관 기간
      recommendation-days: 30  # 추천 정보 보관 기간

  logs:
    place-category:
      enabled: true
      sync-cron: "0 */5 * * * *"  # 5분마다 Redis -> Mongo 동기화